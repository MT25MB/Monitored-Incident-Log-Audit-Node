name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Run offline test suite
        run: python -m pytest -v tests/

      - name: Dry-run validate benchmark dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from src.guardrails.sanitizer import sanitize_alert
          from src.schemas import SecurityAlert

          dataset = Path("evals/datasets/full_benchmark.jsonl")
          validated = 0

          for line_number, line in enumerate(dataset.read_text(encoding="utf-8").splitlines(), 1):
              if not line.strip():
                  continue
              try:
                  case = json.loads(line)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"line {line_number}: invalid JSON: {exc}") from exc

              try:
                  alert = SecurityAlert.model_validate(case.get("alert"))
              except Exception as exc:
                  raise SystemExit(f"line {line_number}: invalid SecurityAlert: {exc}") from exc

              try:
                  result = sanitize_alert(alert)
              except Exception as exc:
                  raise SystemExit(f"line {line_number}: sanitize_alert failed: {exc}") from exc

              if not result.text.startswith("<untrusted_log_payload>"):
                  raise SystemExit(f"line {line_number}: payload was not wrapped")
              validated += 1

          if validated == 0:
              raise SystemExit("no cases validated")
          print(f"Validated {validated} alert cases from {dataset}")
          PY
