[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "milan"
version = "0.1.0"
description = "Monitored Incident & Log Audit Node - guarded SOC alert triage agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "MILAN contributors" },
]
keywords = ["soc", "security", "langgraph", "triage", "red-team", "duckdb"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

# All dependencies are free/open-source. LLM usage is restricted to free tiers.
dependencies = [
  "duckdb>=1.0,<2",
  "langgraph>=0.2,<2",
  "langchain-core>=0.3,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.36,<2",
  "google-genai>=0.1",
  "groq>=0.11,<1",
  "openai>=1.40,<2",
  "httpx>=0.27,<1",
  "tenacity>=8.5,<9",
  "tiktoken>=0.7,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
milan = "src.cli:main"
milan-eval = "evals.run_eval:main"
milan-ui = "src.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
